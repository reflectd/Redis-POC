<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Redis Cache Demo</title>
  <style>
    /* Reset some default styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #f5f7fa;
      color: #333;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .container {
      background: white;
      padding: 2.5rem 3rem;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      max-width: 450px;
      width: 100%;
    }

    h1 {
      font-weight: 700;
      color: #2c3e50;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    form label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #34495e;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1.8px solid #bdc3c7;
      border-radius: 6px;
      font-size: 1rem;
      transition: border-color 0.3s ease;
      margin-bottom: 1.5rem;
    }

    input[type="text"]:focus {
      border-color: #2980b9;
      outline: none;
      box-shadow: 0 0 8px rgba(41, 128, 185, 0.3);
    }

    button {
      width: 100%;
      background: #2980b9;
      border: none;
      padding: 0.75rem;
      font-size: 1.1rem;
      color: white;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background: #1c5980;
    }

    #result {
      margin-top: 1.75rem;
      padding: 1rem 1.25rem;
      background: #ecf0f1;
      border-radius: 10px;
      color: #2c3e50;
      min-height: 3.5rem;
      font-size: 1rem;
      box-shadow: inset 0 0 6px rgba(0,0,0,0.05);
	  overflow-wrap: break-word;
	  white-space: normal;
    }

    #result p {
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Hash Generator with Redis Cache</h1>
    <form id="hashForm">
      <label for="dataInput">Data to hash:</label>
      <input type="text" id="dataInput" required />

      <label for="apiKeyInput">API Key:</label>
      <input type="text" id="apiKeyInput" required />

      <button type="submit">Generate Hash</button>
    </form>

    <div id="result"></div>
  </div>

  <script>
    const form = document.getElementById('hashForm');
    const resultDiv = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const data = document.getElementById('dataInput').value;
      const apiKey = document.getElementById('apiKeyInput').value;
	
	  resultDiv.innerHTML = `<p><strong>Loading result...</strong></p>`
	
      const start = performance.now();

      try {
        const response = await fetch('/api', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': apiKey,
          },
          body: JSON.stringify({ data }),
        });

        const end = performance.now();
        const timeMs = (end - start).toFixed(2);

        if (!response.ok) {
          const error = await response.json();
          resultDiv.textContent = `Error: ${error.error}`;
          return;
        }

        const cacheStatus = response.headers.get('X-Cache') || 'Unknown';
        const json = await response.json();

        resultDiv.innerHTML = `
          <p><strong>Result:</strong> ${json.result}</p>
          <p><strong>Cache status:</strong> ${cacheStatus}</p>
          <p><strong>Response time:</strong> ${timeMs} ms</p>
        `;
      } catch (err) {
        resultDiv.textContent = 'Request failed';
      }
    });
  </script>
</body>
</html>
